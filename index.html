<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAE6D8;
    --surface:#FFFDF7;
    --surface-2:#F3EFE2;
    --ink:#20301F;
    --ink-soft:#5B6656;
    --primary:#1F3A2E;
    --primary-light:#2F5443;
    --accent:#C7DB2E;
    --accent-ink:#1D2A12;
    --rust:#B23A2E;
    --line:#D9D3BE;
    --tag-cattle:#E8862B;
    --tag-sheep:#5C88C4;
    --tag-goat:#C4508C;
    --tag-chicken:#D9B92B;
    --tag-duck:#2BA893;
    --tag-rabbit:#8C6FC4;
    --tag-fish:#2B9BC4;
    --font-display:'Archivo Black', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
    --radius:10px;
    --shadow: 0 1px 2px rgba(32,48,31,0.06), 0 4px 14px rgba(32,48,31,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; font-size:15px;
  }
  #root{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  a{color:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;background:
    radial-gradient(circle at 15% 10%, rgba(199,219,46,0.16), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(199,219,46,0.10), transparent 40%),
    var(--primary);
    color:#F4F1E4;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
  .brand-tag{width:44px;height:34px;border-radius:3px 12px 12px 3px;background:var(--accent);position:relative;flex:none;}
  .brand-tag::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:rgba(29,42,18,0.35);}
  .brand h1{font-family:var(--font-display);font-size:20px;letter-spacing:0.3px;margin:0;line-height:1.15;color:#F4F1E4;}
  .brand p{margin:2px 0 0;font-size:12px;color:#C9D3C0;font-family:var(--font-mono);letter-spacing:0.4px;text-transform:uppercase;}

  .login-card{background:rgba(244,241,228,0.06);border:1px solid rgba(244,241,228,0.14);border-radius:16px;padding:22px;}
  .login-card h2{font-family:var(--font-display);font-size:15px;margin:0 0 14px;color:#F4F1E4;font-weight:400;}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
  .role-btn{background:rgba(244,241,228,0.08);border:1.5px solid rgba(244,241,228,0.2);border-radius:10px;padding:14px 6px;color:#F4F1E4;text-align:center;font-size:13px;font-weight:600;}
  .role-btn small{display:block;font-family:var(--font-mono);font-weight:500;font-size:10px;color:#C9D3C0;margin-top:3px;text-transform:uppercase;}
  .role-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .role-btn.active small{color:rgba(29,42,18,0.65);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#C9D3C0;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px;font-family:var(--font-mono);}
  .login-card input[type=password], .login-card input[type=text]{
    width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid rgba(244,241,228,0.25);
    background:rgba(20,32,17,0.35);color:#F4F1E4;font-size:16px;
  }
  .login-card input::placeholder{color:#8FA085;}
  .btn-primary{width:100%;background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:15px;font-weight:700;font-size:15px;margin-top:4px;}
  .btn-primary:active{transform:scale(0.99);}
  .login-hint{margin-top:16px;font-size:11.5px;color:#94A288;line-height:1.5;}
  .login-error{background:rgba(178,58,46,0.25);border:1px solid rgba(178,58,46,0.5);color:#F8DAD6;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;}

  /* ---------- App shell ---------- */
  .app-header{position:sticky;top:0;z-index:20;background:var(--primary);color:#F4F1E4;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);}
  .app-header .htag{width:26px;height:20px;border-radius:2px 8px 8px 2px;background:var(--accent);flex:none;position:relative;}
  .app-header .htag::before{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:rgba(29,42,18,0.4);}
  .app-header h1{font-family:var(--font-display);font-size:15px;margin:0;flex:1;line-height:1.2;}
  .app-header .role-pill{font-family:var(--font-mono);font-size:10.5px;background:rgba(244,241,228,0.14);padding:5px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;}
  .back-btn{background:none;border:none;color:#F4F1E4;font-size:20px;padding:2px 6px 2px 0;line-height:1;}
  .logout-btn{background:none;border:none;color:#C9D3C0;font-size:11px;font-family:var(--font-mono);text-decoration:underline;padding:0;margin-left:8px;}

  main{flex:1;padding:16px 16px 96px;overflow-y:auto;}
  .screen-title{font-family:var(--font-display);font-size:19px;margin:2px 0 4px;}
  .screen-sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  .bottom-nav{position:sticky;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(32,48,31,0.06);}
  .nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:10px;color:var(--ink-soft);font-size:10.5px;font-weight:600;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.2px;}
  .nav-btn.active{color:var(--primary);background:var(--surface-2);}
  .nav-btn svg{width:20px;height:20px;}

  /* ---------- Cards & buttons ---------- */
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:1px solid var(--line);}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;}
  .kpi .n{font-family:var(--font-display);font-size:24px;line-height:1;color:var(--primary);}
  .kpi .l{font-size:11.5px;color:var(--ink-soft);margin-top:5px;font-weight:600;}
  .kpi.alert .n{color:var(--rust);}

  .btn{border-radius:10px;padding:13px 16px;font-weight:700;font-size:14px;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-block{width:100%;}
  .btn-accent{background:var(--accent);color:var(--accent-ink);}
  .btn-dark{background:var(--primary);color:#F4F1E4;}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-danger{background:var(--rust);color:#fff;}
  .btn-ghost{background:var(--surface-2);color:var(--ink);}
  .btn-sm{padding:9px 12px;font-size:12.5px;border-radius:8px;}
  .btn:disabled{opacity:0.45;pointer-events:none;}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
  .home-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 14px;text-align:left;box-shadow:var(--shadow);}
  .home-tile .ico{width:30px;height:30px;margin-bottom:14px;color:var(--primary);}
  .home-tile h3{font-family:var(--font-display);font-size:14.5px;margin:0 0 3px;}
  .home-tile p{margin:0;font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Ear tag chip ---------- */
  .eartag{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 16px;border-radius:4px 14px 14px 4px;font-family:var(--font-mono);font-weight:700;font-size:12px;position:relative;color:#1a1a1a;white-space:nowrap;}
  .eartag::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,0.28);}

  /* ---------- Search / filters ---------- */
  .search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;}
  .search-box input{border:none;outline:none;background:none;flex:1;font-size:15px;color:var(--ink);}
  .search-box svg{width:17px;height:17px;color:var(--ink-soft);flex:none;}
  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .filter-row select{border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:12.5px;background:var(--surface);color:var(--ink);font-family:var(--font-body);flex:none;}
  .pen-chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;}
  .pen-chip{flex:none;padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .pen-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* ---------- Animal list rows ---------- */
  .animal-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;}
  .animal-row .meta{flex:1;min-width:0;}
  .animal-row .id{font-family:var(--font-mono);font-weight:700;font-size:13.5px;color:var(--ink);}
  .animal-row .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .animal-row .stage-pill{font-size:10px;font-weight:700;text-transform:uppercase;padding:4px 8px;border-radius:20px;background:var(--surface-2);color:var(--primary);white-space:nowrap;font-family:var(--font-mono);}
  .flag{color:var(--rust);font-size:10.5px;font-weight:700;margin-top:3px;font-family:var(--font-mono);}
  .empty-state{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:0.5;}

  /* ---------- Detail screen ---------- */
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
  .detail-head h2{font-family:var(--font-mono);font-size:21px;margin:8px 0 2px;}
  .detail-head .species-sex{font-size:13px;color:var(--ink-soft);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;}
  .info-grid .label{color:var(--ink-soft);font-size:11px;text-transform:uppercase;font-family:var(--font-mono);letter-spacing:0.3px;margin-bottom:3px;}
  .info-grid .val{font-weight:600;}
  .clearance-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .clearance-pill{font-size:11px;font-weight:700;padding:6px 10px;border-radius:20px;font-family:var(--font-mono);}
  .clearance-pill.yes{background:rgba(199,219,46,0.35);color:#3E4A18;}
  .clearance-pill.no{background:rgba(178,58,46,0.15);color:var(--rust);}

  .stage-timeline{display:flex;align-items:center;gap:3px;margin:14px 0 4px;overflow-x:auto;padding-bottom:6px;}
  .stage-notch{flex:none;text-align:center;min-width:52px;}
  .stage-notch .dot{width:22px;height:22px;border-radius:4px 10px 10px 4px;margin:0 auto 5px;border:2px solid var(--line);background:var(--surface);position:relative;}
  .stage-notch .dot::before{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--line);}
  .stage-notch.done .dot{background:var(--primary-light);border-color:var(--primary-light);}
  .stage-notch.done .dot::before{background:rgba(255,255,255,0.5);}
  .stage-notch.current .dot{background:var(--accent);border-color:var(--accent-ink);}
  .stage-notch.current .dot::before{background:rgba(29,42,18,0.4);}
  .stage-notch .stlabel{font-size:9px;color:var(--ink-soft);line-height:1.2;font-family:var(--font-mono);}
  .stage-notch.current .stlabel{color:var(--primary);font-weight:700;}

  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;}
  .action-btn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 10px;font-weight:700;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
  .action-btn svg{width:19px;height:19px;color:var(--primary);}
  .action-btn.wide{grid-column:1 / -1;background:var(--primary);color:#fff;}
  .action-btn.wide svg{color:var(--accent);}

  /* ---------- Forms ---------- */
  .form-field{margin-bottom:15px;}
  .form-field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px;font-family:var(--font-mono);}
  .form-field input, .form-field select, .form-field textarea{
    width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
    font-size:16px;color:var(--ink);
  }
  .form-field textarea{min-height:70px;resize:vertical;font-family:var(--font-body);}
  .toggle-row{display:flex;gap:10px;}
  .toggle-opt{flex:1;text-align:center;padding:12px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:var(--surface);color:var(--ink-soft);}
  .toggle-opt.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .toggle-opt.on.deny{background:var(--rust);border-color:var(--rust);color:#fff;}
  .form-context{background:var(--surface-2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .form-context b{color:var(--ink);}
  .offspring-block{border:1.5px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:10px;position:relative;}
  .offspring-block .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--rust);font-weight:700;font-size:12px;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .btn{flex:1;}
  .note-inline{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 16px;}

  /* ---------- Reports ---------- */
  .bar-row{margin-bottom:12px;}
  .bar-row .bhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px;}
  .bar-track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);border-radius:6px;}
  .report-tile{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;}
  .report-tile h4{margin:0 0 2px;font-family:var(--font-display);font-size:13.5px;}
  .report-tile p{margin:0;font-size:11.5px;color:var(--ink-soft);}
  .report-tile .arrow{color:var(--primary);font-size:18px;}

  /* ---------- Settings ---------- */
  .settings-section{margin-bottom:6px;}
  .settings-section h4{font-family:var(--font-display);font-size:13px;margin:18px 0 8px;color:var(--primary);}
  .list-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;font-size:13px;}
  .rules-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;}
  .rules-table th{text-align:left;font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);padding:6px 4px;border-bottom:1.5px solid var(--line);}
  .rules-table td{padding:6px 4px;border-bottom:1px solid var(--line);}
  .pwd-form{display:none;margin-top:8px;gap:8px;flex-direction:column;}
  .pwd-form.open{display:flex;}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--primary);color:#F4F1E4;padding:12px 18px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, bottom .25s;max-width:88%;text-align:center;}
  .toast.err{background:var(--rust);}
  .toast.show{opacity:1;bottom:96px;}

  @media(min-width:561px){
    #root{border-left:1px solid var(--line);border-right:1px solid var(--line);}
  }
</style>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

/* ================= Backend connection (Google Sheets + Apps Script) =================
 * Reads come from the sheet's published-CSV links (fast, no auth, but cached by
 * Google for a few minutes). Writes go through the Apps Script /exec endpoint
 * (doPost: action "intake" or "event"), and each write is followed by a
 * GET ?action=readRow&id=... call to pull back the freshly recalculated
 * formula columns for just that animal, so the UI doesn't have to wait out
 * the CSV cache to show correct data.
 *
 * Local-only: pens list and user/role passwords have no matching sheet or
 * Apps Script action, so they still live in this device's window.storage
 * ("ranch-config") rather than the spreadsheet.
 */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7L7lc5pM8vGQNhJU6ceTxpG7MaXTLLyZYe8y9x01NmtVpk-lnyg9YWcg6NMMSJ52J/exec";
const CSV_URLS = {
  engine:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs05if1fhs8qhao0EP7-FuUibBSIxy367Libt6I0tbza63-sMniZB0uqmdXdgFcZXqxEG7zG7fj8zj/pub?gid=1781506779&single=true&output=csv",
  dashboard: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTrOSZt-6hN4HMgziMFgAkcLSI9LaXIjLBYJxUhCWUyrGx4KByNtJRihLPXh-zNADwxuZvy10qNOVNj/pub?gid=1707463665&single=true&output=csv", // TODO: no new URL was given for the Dashboard tab — still points at the OLD workbook, replace when you have it
  rules:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs05if1fhs8qhao0EP7-FuUibBSIxy367Libt6I0tbza63-sMniZB0uqmdXdgFcZXqxEG7zG7fj8zj/pub?gid=48772557&single=true&output=csv",
  calendar:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs05if1fhs8qhao0EP7-FuUibBSIxy367Libt6I0tbza63-sMniZB0uqmdXdgFcZXqxEG7zG7fj8zj/pub?gid=1172099208&single=true&output=csv",
  eventLog:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs05if1fhs8qhao0EP7-FuUibBSIxy367Libt6I0tbza63-sMniZB0uqmdXdgFcZXqxEG7zG7fj8zj/pub?gid=523385374&single=true&output=csv",
  legend:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs05if1fhs8qhao0EP7-FuUibBSIxy367Libt6I0tbza63-sMniZB0uqmdXdgFcZXqxEG7zG7fj8zj/pub?gid=1105976987&single=true&output=csv"
};

// Minimal RFC4180-ish CSV parser (handles quoted fields, embedded commas/newlines, "" escapes).
function parseCSV(text){
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ""; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === '\r'){ /* skip, \n handles the break */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c!=="")).map(r=>{
    const o = {}; headers.forEach((h,i)=>{ o[h] = r[i]!==undefined ? r[i] : ""; }); return o;
  });
}
async function fetchCSV(url){
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("CSV fetch failed: "+res.status);
  return parseCSV(await res.text());
}
function toBool(v){
  if(typeof v === "boolean") return v;
  const s = String(v==null?"":v).trim().toLowerCase();
  return s==="true"||s==="yes"||s==="1";
}
// Google Sheets CSV export renders dates like "Mon Aug 03 2026 00:00:00" or
// already-ISO "2026-08-03" depending on cell formatting; normalize to YYYY-MM-DD.
function fmtCSVDate(v){
  if(!v) return "";
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const d = new Date(s);
  if(isNaN(d)) return "";
  return d.toISOString().slice(0,10);
}
async function postToBackend(payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:"POST",
      // text/plain avoids a CORS preflight against Apps Script (which doesn't
      // handle OPTIONS); doPost still reads the raw body via e.postData.contents.
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    return { success:false, error: e.message || "Network error reaching the Apps Script backend." };
  }
}
async function readRowFromBackend(id){
  try{
    const url = APPS_SCRIPT_URL + "?action=readRow&id=" + encodeURIComponent(id);
    const res = await fetch(url);

  }catch(e){
    return { success:false, error: e.message || "Network error reaching the Apps Script backend." };
  }
}

function stagesFor(species){ return LIFECYCLE_RULES[species] || LIFECYCLE_RULES.Cattle; }
function ageDays(dob, ref){
  if(!dob) return null;
  ref = ref || new Date();
  const d = new Date(dob);
  return Math.max(0, Math.floor((ref - d) / 86400000));
}
// animal is optional; when provided and it carries a live value read back
// from Lifecycle_Engine (Biological_Current_Stage / Overdue_Finishing_Flag /
// Harvest_Ready_Flag / Finishing_Max_Age_Days), that value wins — the sheet
// is the single source of truth per the backend's own design. The local
// LIFECYCLE_RULES/FINISHING_MAX tables are only a fallback for animals that
// haven't been read back from the sheet yet (e.g. mid-intake, before the
// post-write readRow completes).
function biologicalStage(species, age, animal){
  if(animal && animal._biologicalStage) return animal._biologicalStage;
  if(age===null || age===undefined) return "Unclassified";
  const rows = stagesFor(species);
  for(const r of rows){ if(age>=r.min && age<=r.max) return r.stage; }
  return rows[rows.length-1].stage;
}
function isOverdueFinishing(species, age, harvested, animal){
  if(harvested || age===null) return false;
  if(animal && typeof animal._overdueFinishing === "boolean") return animal._overdueFinishing;
  const max = (animal && animal._finishingMaxAge) || FINISHING_MAX[species] || 5000;
  return age > max;
}
function isHarvestReady(a){
  if(a.status!=="Active") return false;
  if(typeof a._harvestReady === "boolean") return a._harvestReady;
  const bs = biologicalStage(a.species, ageDays(a.dob), a);
  return (bs==="Harvest" || isOverdueFinishing(a.species, ageDays(a.dob), false, a)) &&
         a.healthClearance==="Yes" && a.withdrawalClearance==="Yes" && a.welfareClearance==="Yes";
}
function fmtDate(v){
  if(!v) return "—";
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Turns one Lifecycle_Engine row (+ that animal's Event_Log rows, for fields
// with no dedicated Engine column yet) into the animal shape the UI expects.
function mapEngineRowToAnimal(row, events){
  events = events || [];
  const intakeEvent = events.find(e=>e.type==="Intake"||e.type==="intake");
  let extra = {};
  if(intakeEvent && intakeEvent.payload){
    try{ extra = JSON.parse(typeof intakeEvent.payload==="string" ? intakeEvent.payload : JSON.stringify(intakeEvent.payload)); }catch(e){ extra = {}; }
  }
  const opStage = row.Current_Operational_Stage || "";
  const harvestDate = row.Harvest_Date ? fmtCSVDate(row.Harvest_Date) : null;
  const status = opStage==="Dead" ? "Dead" : harvestDate ? "Harvested" : "Active";
  const ageDaysVal = row.Age_Days!==undefined && row.Age_Days!=="" ? Number(row.Age_Days) : null;

  return mkAnimal({
    id: row.Animal_ID,
    species: row.Species || "",
    sex: row.Sex || "Unknown",
    dob: row.DOB ? fmtCSVDate(row.DOB) : "",
    weight: parseFloat(row.Current_Weight)||0,
    pen: row.Pen_Location || extra.pen || "",
    breed: row.Breed_Genetics || extra.breed || "",
    origin: extra.origin==="Purchased" ? `Purchased — ${extra.source||"Unspecified source"}` : "Ranch-Born",
    intakeStage: row.Intake_Stage || "",
    intakeDate: row.Intake_Date ? fmtCSVDate(row.Intake_Date) : "",
    weaningDate: row.Weaning_Date ? fmtCSVDate(row.Weaning_Date) : null,
    breedingDate: row.Breeding_Date ? fmtCSVDate(row.Breeding_Date) : null,
    calvingDate: row.Calving_Date ? fmtCSVDate(row.Calving_Date) : null,
    harvestDate: harvestDate,
    transportLoadDate: row.Transport_Load_Date ? fmtCSVDate(row.Transport_Load_Date) : null,
    transportDepartedDate: row.Transport_Departed_Date ? fmtCSVDate(row.Transport_Departed_Date) : null,
    operationalStage: opStage || null,
    nextOperationalStage: row.Next_Operational_Stage || null,
    stageStartDate: row.Operational_Stage_Start_Date || null,
    healthClearance: row.Health_Clearance || "No",
    withdrawalClearance: row.Withdrawal_Clearance || "No",
    welfareClearance: row.Welfare_Clearance || "No",
    gestationDays: row.Gestation_Days!==undefined && row.Gestation_Days!=="" ? Number(row.Gestation_Days) : null,
    weaningDaysForecast: row.Weaning_Days_Forecast!==undefined && row.Weaning_Days_Forecast!=="" ? Number(row.Weaning_Days_Forecast) : null,
    returnToBreedingDays: row.Return_To_Breeding_Days!==undefined && row.Return_To_Breeding_Days!=="" ? Number(row.Return_To_Breeding_Days) : null,
    expectedBirthDate: row.Expected_Birth_Date ? fmtCSVDate(row.Expected_Birth_Date) : null,
    expectedWeaningDate: row.Expected_Weaning_Date ? fmtCSVDate(row.Expected_Weaning_Date) : null,
    nextBreedingWindowOpen: row.Next_Breeding_Window_Open ? fmtCSVDate(row.Next_Breeding_Window_Open) : null,
    nextBreedingCycleStart: row.Next_Breeding_Cycle_Start ? fmtCSVDate(row.Next_Breeding_Cycle_Start) : null,
    suggestedBreedingDate: row.Suggested_Breeding_Date ? fmtCSVDate(row.Suggested_Breeding_Date) : null,
    sireId: extra.sireId || "",
    notes: intakeEvent ? (intakeEvent.notes||"") : "",
    status: status,
    _ageDays: ageDaysVal,
    _biologicalStage: row.Biological_Current_Stage || row.Unified_Current_Stage || null,
    _overdueFinishing: row.Overdue_Finishing_Flag!==undefined ? toBool(row.Overdue_Finishing_Flag) : null,
    _harvestReady: row.Harvest_Ready_Flag!==undefined ? toBool(row.Harvest_Ready_Flag) : null,
    _finishingMaxAge: row.Finishing_Max_Age_Days!==undefined && row.Finishing_Max_Age_Days!=="" ? Number(row.Finishing_Max_Age_Days) : null
  });
}
function mapEventLogRows(rows){
  // Event_Log columns per Code.gs appendEventLog: Timestamp, Animal_ID,
  // Event_Type, User_Name, User_Role, Notes, Extra_Fields_JSON.
  return rows.map(r=>{
    let payload = null;
    try{ payload = JSON.parse(r.Extra_Fields_JSON||"null"); }catch(e){ payload = null; }
    return {
      ts: r.Timestamp || "",
      animalId: r.Animal_ID || "—",
      type: r.Event_Type || "",
      user: r.User_Name || "Unknown",
      role: r.User_Role || "Unknown",
      notes: r.Notes || "",
      payload
    };
  }).sort((a,b)=> new Date(b.ts) - new Date(a.ts));
}
function buildAnimalsFromSheets(engineRows, eventLog){
  const eventsByAnimal = {};
  eventLog.forEach(ev=>{ (eventsByAnimal[ev.animalId] = eventsByAnimal[ev.animalId]||[]).push(ev); });
  return engineRows.filter(r=>r.Animal_ID).map(r=>mapEngineRowToAnimal(r, eventsByAnimal[r.Animal_ID]));
}

async function loadState(force){
  if(STATE && !force) return STATE;
  const config = await loadConfig();
  let animals = [], eventLog = [];
  try{
    const [engineRows, eventRows] = await Promise.all([fetchCSV(CSV_URLS.engine), fetchCSV(CSV_URLS.eventLog)]);
    eventLog = mapEventLogRows(eventRows);
    animals = buildAnimalsFromSheets(engineRows, eventLog);
  }catch(e){
    toast("Couldn't load ranch data from the spreadsheet — check your connection and try again.", true);
  }
  STATE = { version:2, users:config.users, pens:config.pens, animals, eventLog };
  return STATE;
}
// Re-fetches a single animal's row straight from the Apps Script (not the
// cached CSV export) right after a write, and splices the fresh, recalculated
// record into STATE.animals. fallbackExtra carries values (breed/pen/source/
// origin/sireId) that only live in Event_Log when Lifecycle_Engine has no
// dedicated column for them yet.
async function refreshAnimalFromSheet(id, fallbackExtra){
  const result = await readRowFromBackend(id);
  if(!result || !result.success) return null;
  const priorEvents = STATE.eventLog.filter(e=>e.animalId===id);
  const animal = mapEngineRowToAnimal(result.row, priorEvents);
  if(fallbackExtra){
    if(!result.row.Breed_Genetics && fallbackExtra.breed) animal.breed = fallbackExtra.breed;
    if(!result.row.Pen_Location && fallbackExtra.pen) animal.pen = fallbackExtra.pen;
    if(fallbackExtra.origin) animal.origin = fallbackExtra.origin==="Purchased" ? `Purchased — ${fallbackExtra.source||"Unspecified source"}` : "Ranch-Born";
    if(fallbackExtra.sireId) animal.sireId = fallbackExtra.sireId;
  }
  const idx = STATE.animals.findIndex(x=>x.id===id);
  if(idx>=0) STATE.animals[idx] = animal; else STATE.animals.push(animal);
  return animal;
}
function logEventLocal(animalId, type, notes, payload){
  // Optimistic local echo only — the authoritative copy is the row Code.gs
  // appends to Event_Log; this just avoids a blank history list before the
  // next full reload.
  STATE.eventLog.unshift({ts:nowISO(), animalId, type, user:SESSION.name||SESSION.role, role:SESSION.role, notes:notes||"", payload:payload||null});
  if(STATE.eventLog.length>300) STATE.eventLog.length = 300;
}
function findAnimal(id){ return STATE.animals.find(a=>a.id===id); }

function generateId(species){
  const prefix = SPECIES_PREFIX[species] || "ANM";
  let id;
  do{
    const n = Math.floor(100000 + Math.random()*899999);
    id = `NR-${prefix}-${n}`;
  }while(findAnimal(id));
  return id;
}

  const items = [["home","Home","home"],["animals","Animals","animals"],["events","Events","events"],["reports","Reports","reports"]];
  if(SESSION.role==="manager"||SESSION.role==="founder") items.push(["settings","Settings","settings"]);
  return `<div class="bottom-nav">${items.map(([k,l,ic])=>`
    <button class="nav-btn ${active===k?'active':''}" data-nav="${k}">${ICONS[ic]}<span>${l}</span></button>
  `).join("")}</div>`;
}

async function navigate(screen, params){
  NAV = { screen, params: params||{} };
  await render();
  window.scrollTo(0,0);
  const m = root.querySelector("main"); if(m) m.scrollTop = 0;
}

async function render(){
  if(NAV.screen==="login"){ root.innerHTML = renderLogin(); bindLogin(); return; }
  await loadState();
  let body="";
  switch(NAV.screen){
    case "home": body = renderHome(); break;
    case "animals": body = renderAnimals(); break;
    case "animalDetail": body = renderAnimalDetail(NAV.params.id); break;
    case "intake": body = renderIntake(); break;
    case "events": body = renderEvents(); break;
    case "eventForm": body = renderEventForm(NAV.params.type, NAV.params.id); break;
    case "reports": body = renderReports(); break;
    case "reportDetail": body = renderReportDetail(NAV.params.type); break;
    case "settings": body = renderSettings(); break;
    case "editRecord": body = renderEditRecord(NAV.params.id); break;
    case "history": body = renderHistory(NAV.params.id); break;
    default: body = renderHome();
  }
  root.innerHTML = body;
  bindGlobal();
  bindScreen();
}

let loginRole = "worker";
function renderLogin(){
  return `

          <button type="button" class="role-btn ${loginRole==='manager'?'active':''}" data-role="manager">Manager<small>Runs ops</small></button>
          <button type="button" class="role-btn ${loginRole==='founder'?'active':''}" data-role="founder">Founder<small>Full access</small></button>
        </div>
      </div>
      <div class="field"><label>Password</label>
        <input type="password" id="loginPwd" placeholder="Enter password" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="loginBtn">Sign in as ${loginRole}</button>
      <div class="login-hint">Each role has its own password, set by the Founder or Manager under Settings &rarr; Users &amp; Roles. First time here? Ask whoever set up this tool for your role's password.</div>
    </div>
  </div>`;
}
function bindLogin(){
  root.querySelectorAll("[data-role]").forEach(b=>b.addEventListener("click",()=>{ loginRole=b.dataset.role; render(); }));
  const btn = root.querySelector("#loginBtn");
  const pwdInput = root.querySelector("#loginPwd");
  async function doLogin(){
    await loadState();
    const pwd = pwdInput.value;
    const rec = STATE.users[loginRole];
    if(rec && pwd===rec.password){
      SESSION = {role:loginRole, name:loginRole.charAt(0).toUpperCase()+loginRole.slice(1)};
      navigate("home");
    } else {
      root.querySelector("#loginErr").innerHTML = `<div class="login-error">Incorrect password for ${loginRole}. Try again.</div>`;
    }
  }
  btn.addEventListener("click", doLogin);
  pwdInput.addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}

function allStageNames(){
  const s = new Set();
  Object.values(LIFECYCLE_RULES).forEach(rows=>rows.forEach(r=>s.add(r.stage)));
  return Array.from(s);
}
function filteredAnimals(){
  const q = animalFilters.q.trim().toLowerCase();
  return STATE.animals.filter(a=>{
    if(animalFilters.species && a.species!==animalFilters.species) return false;
    if(animalFilters.pen && a.pen!==animalFilters.pen) return false;
    if(animalFilters.stage && biologicalStage(a.species, ageDays(a.dob), a)!==animalFilters.stage) return false;
    if(q){
      const hay = `${a.id} ${a.breed||''} ${a.pen||''} ${a.species}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
}
function renderAnimalListRows(list){
  if(!list.length) return `<div class="empty-state">${ICONS.empty}<div>No animals match those filters.</div></div>`;
  return list.map(a=>{
    const age = ageDays(a.dob);
    const stage = biologicalStage(a.species, age, a);
    const overdue = isOverdueFinishing(a.species, age, a.status!=="Active", a);
    const ready = isHarvestReady(a);
    return `
    <button class="animal-row" data-nav="animalDetail" data-params='${esc(JSON.stringify({id:a.id}))}'>
      ${speciesTag(a.species, a.id)}
      <div class="meta">
        <div class="sub">${a.species} · ${a.sex} · Pen ${a.pen||"—"} ${a.breed?`· ${esc(a.breed)}`:""}</div>
        ${overdue?`<div class="flag">OVERDUE FINISHING</div>`:ready?`<div class="flag" style="color:#5C7A1E">HARVEST READY</div>`:""}
      </div>
      <span class="stage-pill">${stage}${a.status!=="Active"?` · ${a.status}`:""}</span>
    </button>`;
  }).join("");
}

  const canManage = SESSION.role==="manager"||SESSION.role==="founder";

  const ready = isHarvestReady(a);

  const actions = [];
  actions.push(["weight","Weight","weight"]);
  actions.push(["health","Health","health"]);
  actions.push(["movement","Movement","movement"]);
  if(a.sex==="Female") actions.push(["breeding","Breeding","breeding"]);
  if(!a.weaningDate) actions.push(["weaning","Weaning","weaning"]);
  if(a.sex==="Female") actions.push(["calving","Calving","calving"]);
  if(a.status==="Active") actions.push(["harvest","Harvest","harvest"]);
  actions.push(["transport","Transport","transport"]);
  if(a.status==="Active") actions.push(["mortality","Mortality","mortality"]);

  return `

  <main>
    <div class="card">
      <div class="detail-head">
        <div>
          ${speciesTag(a.species, a.id)}
          <h2>${esc(a.id)}</h2>
          <div class="species-sex">${a.species} · ${a.sex} · Pen ${a.pen||"—"}${a.breed?` · ${esc(a.breed)}`:""}</div>
        </div>
        <span class="stage-pill" style="font-size:11px;">${a.status}</span>
      </div>

      ${overdue?`<div class="clearance-pill no" style="margin-bottom:10px;">&#9888; Overdue finishing — past normal finishing window</div>`:""}
      ${ready?`<div class="clearance-pill yes" style="margin-bottom:10px;">&#10003; Harvest ready — cleared to schedule</div>`:""}

      <div class="stage-timeline">
        ${rows.map((r,i)=>`
          <div class="stage-notch ${i<stageIdx?'done':''} ${i===stageIdx?'current':''}">
            <div class="dot"></div><div class="stlabel">${r.stage.replace(" / ","<br>")}</div>
          </div>`).join("")}
      </div>

      <div class="info-grid" style="margin-top:14px;">
        <div><div class="label">DOB</div><div class="val">${fmtDate(a.dob)}</div></div>
        <div><div class="label">Age</div><div class="val">${age!==null?age+" days":"—"}</div></div>
        <div><div class="label">Weight</div><div class="val">${a.weight} kg</div></div>
        <div><div class="label">Intake</div><div class="val">${a.intakeStage} · ${fmtDate(a.intakeDate)}</div></div>
        <div><div class="label">Biological stage</div><div class="val">${stage}</div></div>
        <div><div class="label">Operational stage</div><div class="val">${a.operationalStage||stage}</div></div>
        ${a.suggestedBreedingDate?`<div><div class="label">Suggested breeding</div><div class="val">${fmtDate(a.suggestedBreedingDate)}</div></div>`:""}
        ${a.sireId?`<div><div class="label">Sire</div><div class="val">${esc(a.sireId)}</div></div>`:""}
      </div>

      <div class="clearance-row">
        <span class="clearance-pill ${a.healthClearance==='Yes'?'yes':'no'}">Health: ${a.healthClearance}</span>
        <span class="clearance-pill ${a.withdrawalClearance==='Yes'?'yes':'no'}">Withdrawal: ${a.withdrawalClearance}</span>
        <span class="clearance-pill ${a.welfareClearance==='Yes'?'yes':'no'}">Welfare: ${a.welfareClearance}</span>

/* ================= Event submit handlers =================
 * Builds a `fields` object matching exactly what Code.gs's handleEvent()
 * switch-statement reads for each event type, POSTs action:"event", then
 * pulls the recalculated row back with refreshAnimalFromSheet(). Some
 * backend behavior is worth knowing before relying on this:
 *  - breeding/harvest/mortality/calving/weaning/finishing all stamp the
 *    *server's* today's date on their Engine date column — a date the
 *    person picks in the form is preserved in Event_Log's notes/fields but
 *    NOT written to Breeding_Date/Harvest_Date/etc. if it isn't today.
 *  - harvest's Final Weight isn't written to Current_Weight by the backend
 *    — it's logged to Event_Log only.
 *  - transport writes a single date to both Transport_Load_Date and
 *    Transport_Departed_Date (fields.transportDate) — the form's separate
 *    load/departed dates collapse to one.
 *  - calving's offspring rows get Species/DOB/Intake_Stage/Intake_Date and
 *    one shared birth weight; Sex isn't written to the sheet for offspring
 *    at all currently, so it's overlaid locally only (won't survive a
 *    reload) until Code.gs's createOffspringRow is extended to accept it.
 */
async function submitEvent(type, id, form){
  const a = findAnimal(id);
  const fd = new FormData(form);
  const get = k => fd.get(k);

  if(type==="breeding" && a.sex!=="Female"){ toast("Only female animals can be bred.", true); return; }
  if(type==="calving" && a.sex!=="Female"){ toast("Calving requires a female animal.", true); return; }
  if(type==="harvest" && !(a.healthClearance==="Yes"&&a.withdrawalClearance==="Yes"&&a.welfareClearance==="Yes")){
    toast("Clearances required before harvest can be logged.", true); return;
  }

  let fields = {};
  let offspringForm = []; // calving only, kept for the local-overlay pass after refresh

  switch(type){
    case "weight":
      fields = { weight: parseFloat(get("weight"))||a.weight, notes: get("notes")||"" };
      break;
    case "health":
      fields = { condition: get("condition"), clearHealth: (get("clearance")||a.healthClearance)==="Yes", notes: get("notes")||"" };
      break;
    case "movement":
      fields = { pen: get("toPen"), notes: get("notes")||"" };
      break;
    case "breeding":
      fields = { date: get("date"), sireId: get("sireId")||"", notes: get("notes")||"" };
      break;
    case "weaning":
      fields = { weight: parseFloat(get("weight"))||undefined, notes: get("notes")||"" };
      break;
    case "calving": {
      let i=0;
      while(fd.has(`off_sex_${i}`)){
        offspringForm.push({ sex: fd.get(`off_sex_${i}`), weight: parseFloat(fd.get(`off_weight_${i}`))||0, notes: fd.get(`off_notes_${i}`)||"" });
        i++;
      }
      fields = {
        outcome: get("outcome"), notes: get("notes")||"", updateStage:true,
        offspringCount: offspringForm.length,
        birthWeight: offspringForm.length ? offspringForm[0].weight : undefined
      };
      break;
    }
    case "harvest":
      fields = {
        date: get("date"), finalWeight: parseFloat(get("finalWeight"))||a.weight, harvestType: get("harvestType"),
        scheduledDate: get("scheduledDate")||"", loadDate: get("loadDate")||"", departedDate: get("departedDate")||""
      };
      break;
    case "transport":
      fields = { transportDate: get("loadDate")||todayISO(), departedDate: get("departedDate")||"", destination: get("destination")||"" };
      break;
    case "mortality":
      fields = { date: get("date"), cause: get("cause"), notes: get("notes")||"" };
      break;
  }

  const submitBtn = form.querySelector("button[type=submit]");
  if(submitBtn) submitBtn.disabled = true;
  toast("Saving to spreadsheet…");
  const result = await postToBackend({ action:"event", animalId:id, eventType:type, fields, user:{name:SESSION.name, role:SESSION.role} });
  if(submitBtn) submitBtn.disabled = false;
  if(!result || !result.success){
    toast("Couldn't save to the spreadsheet: " + (result&&result.error ? result.error : "network error"), true);
    return;
  }

  logEventLocal(id, type, `${EVENT_META[type].title} recorded.`, fields);
  await refreshAnimalFromSheet(id, { sireId: fields.sireId });

  if(type==="calving" && result.offspringIds && result.offspringIds.length){
    for(let i=0;i<result.offspringIds.length;i++){
      const newId = result.offspringIds[i];
      const form_i = offspringForm[i];
      logEventLocal(newId, "intake", `Ranch-born, dam ${a.id}, calving outcome: ${fields.outcome}.${form_i&&form_i.notes?' '+form_i.notes:''}`, {breed:a.breed, pen:a.pen, origin:"Born"});
      const off = await refreshAnimalFromSheet(newId, {breed:a.breed, sireId:a.sireId});
      // Sex isn't persisted by the backend for offspring yet — overlay it
      // locally so it displays correctly for the rest of this session.
      if(off && form_i) off.sex = form_i.sex;
    }
  }

  toast(`${EVENT_META[type].title} saved for ${id}.`);
  navigate("animalDetail",{id});
}

function renderReportDetail(type){
  const titles = {inventory:"Current Inventory", stage:"Stage Distribution", harvest:"Harvest Pipeline", breeding:"Breeding Pipeline"};
  let body = "";
  const active = STATE.animals.filter(a=>a.status==="Active");

  if(type==="inventory"){
    const bySpecies = {};
    active.forEach(a=>{ bySpecies[a.species]=(bySpecies[a.species]||0)+1; });
    const max = Math.max(1,...Object.values(bySpecies));
    body = Object.keys(bySpecies).length ? Object.entries(bySpecies).map(([sp,n])=>`
      <div class="bar-row"><div class="bhead"><span>${sp}</span><span>${n}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n/max*100)}%;background:${SPECIES_COLOR[sp]}"></div></div></div>
    `).join("") : emptyReportMsg();
    body += `<div class="settings-section"><h4>By pen</h4></div>` + Object.entries(
      active.reduce((acc,a)=>{acc[a.pen||'Unassigned']=(acc[a.pen||'Unassigned']||0)+1;return acc;},{})
    ).map(([pen,n])=>`<div class="list-row"><span>${esc(pen)}</span><b>${n}</b></div>`).join("");
  }

  if(type==="stage"){
    const counts = {};
    active.forEach(a=>{ const s = biologicalStage(a.species, ageDays(a.dob), a); counts[s]=(counts[s]||0)+1; });
    const max = Math.max(1,...Object.values(counts));
    body = Object.keys(counts).length ? Object.entries(counts).map(([s,n])=>`
      <div class="bar-row"><div class="bhead"><span>${s}</span><span>${n}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n/max*100)}%"></div></div></div>
    `).join("") : emptyReportMsg();
  }

  if(type==="harvest"){
    const ready = active.filter(isHarvestReady);
    const overdue = active.filter(a=>isOverdueFinishing(a.species, ageDays(a.dob), false, a) && !isHarvestReady(a));
    body = `<div class="settings-section"><h4>Ready for harvest (${ready.length})</h4></div>`;
    body += ready.length ? renderAnimalListRows(ready) : emptyReportMsg();
    body += `<div class="settings-section"><h4>Overdue finishing, clearances pending (${overdue.length})</h4></div>`;
    body += overdue.length ? renderAnimalListRows(overdue) : emptyReportMsg();
  }

  if(type==="breeding"){
    const females = active.filter(a=>a.sex==="Female");
    body = females.length ? females.map(a=>{
      // Suggested_Breeding_Date now comes straight from Lifecycle_Engine
      // (sheet is the source of truth). Fall back to the old local estimate
      // only for animals whose sheet row hasn't populated it yet.
      let suggested = a.suggestedBreedingDate;
      if(!suggested){
        const ret = RETURN_TO_BREEDING[a.species];
        const base = a.calvingDate || a.weaningDate;
        if(ret && base) suggested = new Date(new Date(base).getTime()+ret*86400000).toISOString().slice(0,10);
      }
      const pregnant = a.breedingDate && !a.calvingDate;
      return `<div class="list-row"><div>
          <div style="font-weight:700;font-family:var(--font-mono);">${esc(a.id)}</div>
          <div style="font-size:11px;color:var(--ink-soft);">${a.species} · last bred ${a.breedingDate?fmtDate(a.breedingDate):'never'}</div>
          ${pregnant && a.expectedBirthDate?`<div style="font-size:11px;color:var(--ink-soft);">Expected birth ${fmtDate(a.expectedBirthDate)}</div>`:""}
        </div>
        <div style="text-align:right;font-size:11.5px;">${suggested?`Suggested<br><b>${fmtDate(suggested)}</b>`:'—'}</div>
      </div>`;
    }).join("") : emptyReportMsg();
  }

  return `
  ${header(titles[type], {backTo:"reports"})}
  <main>${body}</main>
  ${bottomNav("reports")}`;
}

function bindIntakeScreen(){
  const originSel = root.querySelector("#originSel");
  const sourceField = root.querySelector("#sourceField");
  originSel.addEventListener("change", ()=>{ sourceField.style.display = originSel.value==="Purchased" ? "block":"none"; });
  const speciesSel = root.querySelector("#intakeSpecies");
  const idInput = root.querySelector("#intakeId");
  const breedSel = root.querySelector("#intakeBreed");
  const breedCustomField = root.querySelector("#breedCustomField");

  function populateBreedDropdown(){
    breedSel.innerHTML = breedsFor(speciesSel.value).map(b=>`<option>${esc(b)}</option>`).join("");
    toggleBreedCustom();
  }
  function toggleBreedCustom(){
    breedCustomField.style.display = breedSel.value==="Other / Custom Crossbreed" ? "block":"none";
  }
  breedSel.addEventListener("change", toggleBreedCustom);
  speciesSel.addEventListener("change", ()=>{ idInput.value = generateId(speciesSel.value); populateBreedDropdown(); });
  root.querySelector("#regenId").addEventListener("click", ()=>{ idInput.value = generateId(speciesSel.value); });

  root.querySelector("#intakeForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const id = fd.get("id").trim();
    if(!id){ toast("An animal ID is required.", true); return; }
    if(findAnimal(id)){ toast("That ID is already in use — try auto-generate.", true); return; }
    const originSelVal = fd.get("origin"); // "Ranch-Born" or "Purchased"
    const isBorn = originSelVal === "Ranch-Born";
    const species = fd.get("species"), dob = fd.get("dob"), intakeDate = fd.get("intakeDate");
    const weight = parseFloat(fd.get("weight"))||0;
    const breedRaw = fd.get("breed")||"";
    const breed = breedRaw==="Other / Custom Crossbreed" ? (fd.get("breedCustom")||"").trim()||"Custom Crossbreed" : breedRaw;
    const pen = fd.get("pen"), source = fd.get("source")||"", notes = fd.get("notes")||"";
    // Local, pre-sheet-lookup estimate — biologicalStage(species, age) falls
    // back to the hardcoded LIFECYCLE_RULES table since this animal has no
    // sheet row (and so no animal._biologicalStage) yet.
    const intakeStage = biologicalStage(species, ageDays(dob));

    const submitBtn = e.target.querySelector("button[type=submit]");
    if(submitBtn) submitBtn.disabled = true;
    toast("Saving to spreadsheet…");
    const result = await postToBackend({
      action:"intake",
      animal:{
        id, species, sex:fd.get("sex"), weight, dob, intakeStage, intakeDate,
        origin: isBorn ? "Born" : "Purchased",
        clearHealth:true, clearWithdrawal:isBorn, clearWelfare:isBorn,
        breed, pen, source, notes
      },
      user:{ name:SESSION.name, role:SESSION.role }
    });
    if(submitBtn) submitBtn.disabled = false;
    if(!result || !result.success){
      toast("Couldn't save to the spreadsheet: " + (result&&result.error ? result.error : "network error"), true);
      return;
    }
    logEventLocal(id,"intake",`${isBorn?"Ranch-Born":"Purchased"} intake — ${species}, ${weight}kg, pen ${pen}.${notes?' '+notes:''}`,
      {breed, pen, source, origin: isBorn?"Born":"Purchased"});
    await refreshAnimalFromSheet(id, {breed, pen, source, origin: isBorn?"Born":"Purchased"});
    toast(`${id} added to the herd.`);
    navigate("animalDetail",{id});
  });
}

  });

  if(type==="calving"){
    offspringCount = 0;
    const wrap = root.querySelector("#offspringWrap");
    root.querySelector("#addOffspring").addEventListener("click", ()=>{
      const div = document.createElement("div");
      div.innerHTML = offspringBlockHtml(offspringCount);
      wrap.appendChild(div.firstElementChild);
      wrap.querySelector(`[data-rm-offspring='${offspringCount}']`).addEventListener("click", ev=>{
        ev.target.closest(".offspring-block").remove();
      });
      offspringCount++;
    });
  }

  form.addEventListener("submit", e=>{ e.preventDefault(); submitEvent(type, id, form); });
}

function bindSettingsScreen(){
  const refreshBtn = root.querySelector("#refreshDataBtn");
  if(refreshBtn) refreshBtn.addEventListener("click", async ()=>{
    refreshBtn.disabled = true;
    toast("Reloading from spreadsheet…");
    await loadState(true);
    refreshBtn.disabled = false;
    toast("Ranch data reloaded.");
    render();
  });
  const addPenBtn = root.querySelector("#addPenBtn");
  if(addPenBtn) addPenBtn.addEventListener("click", async ()=>{
    const v = root.querySelector("#newPen").value.trim();
    if(!v){ toast("Enter a pen name first.", true); return; }
    if(STATE.pens.includes(v)){ toast("That pen already exists.", true); return; }
    STATE.pens.push(v); await saveConfig(); toast(`Pen "${v}" added.`); render();
  });
  root.querySelectorAll("[data-pwd-toggle]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const f = root.querySelector(`#pwdForm_${b.dataset.pwdToggle}`);
      f.classList.toggle("open");
    });
  });
  root.querySelectorAll("[data-pwd-save]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const role = b.dataset.pwdSave;
      const val = root.querySelector(`#pwd_${role}`).value;
      if(!val || val.length<4){ toast("Password must be at least 4 characters.", true); return; }
      STATE.users[role].password = val;
      await saveConfig();
      toast(`Password updated for ${role}.`);
      render();
    });
  });
}

// The Apps Script backend only exposes "intake" and "event" actions — there's
// no generic "update any field" action — so a raw field edit can only be
// persisted for the fields that map onto an existing event type: weight
// (→ event weight), pen (→ event movement), and health clearance (→ event
// health). Species/sex/DOB/breed/origin/status/withdrawal/welfare/notes
// changes here would silently vanish on the next reload, so rather than
// pretend they saved, this reports which fields actually reached the sheet.
async function bindEditRecordScreen(){
  root.querySelector("#editForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const id = NAV.params.id;
    const a = findAnimal(id);
    const fd = new FormData(e.target);
    const vals = Object.fromEntries(fd.entries());

    const saved = [], unsupported = [];
    const submitBtn = e.target.querySelector("button[type=submit]");
    if(submitBtn) submitBtn.disabled = true;
    toast("Saving to spreadsheet…");

    const newWeight = parseFloat(vals.weight);
    if(!isNaN(newWeight) && newWeight !== a.weight){
      const r = await postToBackend({action:"event", animalId:id, eventType:"weight", fields:{weight:newWeight}, user:{name:SESSION.name, role:SESSION.role}});
      if(r&&r.success){ saved.push("weight"); logEventLocal(id,"weight",`Weight recorded: ${newWeight} kg`,{weight:newWeight}); }
      else unsupported.push("weight (save failed)");
    }
    if(vals.pen && vals.pen !== a.pen){
      const r = await postToBackend({action:"event", animalId:id, eventType:"movement", fields:{pen:vals.pen}, user:{name:SESSION.name, role:SESSION.role}});
      if(r&&r.success){ saved.push("pen"); logEventLocal(id,"movement",`Moved to ${vals.pen}`,{pen:vals.pen}); }
      else unsupported.push("pen (save failed)");
    }
    if(vals.healthClearance && vals.healthClearance !== a.healthClearance){
      const r = await postToBackend({action:"event", animalId:id, eventType:"health", fields:{clearHealth: vals.healthClearance==="Yes"}, user:{name:SESSION.name, role:SESSION.role}});
      if(r&&r.success){ saved.push("health clearance"); logEventLocal(id,"health",`Clearance: ${vals.healthClearance}`,{clearHealth:vals.healthClearance==="Yes"}); }
      else unsupported.push("health clearance (save failed)");
    }
    ["species","sex","dob","breed","origin","status","withdrawalClearance","welfareClearance","notes"].forEach(k=>{
      if(vals[k]!==undefined && vals[k]!==(a[k]??"")) unsupported.push(k);
    });

    if(submitBtn) submitBtn.disabled = false;
    await refreshAnimalFromSheet(id, {});

    if(unsupported.length){
      toast(`Saved: ${saved.length?saved.join(", "):"nothing"}. Not supported by the current backend: ${unsupported.join(", ")}.`, true);
    } else if(saved.length){
      toast(`Saved: ${saved.join(", ")}.`);
    } else {
      toast("No changes to save.");
    }
    navigate("animalDetail",{id});
  });
}

/* ================= Boot ================= */
(async function boot(){
  try{
    await loadState();
    navigate("login");
  }catch(err){
    console.error("Ngapori Ranch failed to start:", err);
    const rootEl = document.getElementById("root");
    if(rootEl){
      rootEl.innerHTML = `<div style="padding:24px;font-family:sans-serif;">
        <h2>Couldn't start the app</h2>
        <p>${esc(err && err.message ? err.message : String(err))}</p>
        <p style="color:#888;font-size:13px;">Check the browser console for details. This usually means the spreadsheet CSV links or Apps Script URL aren't reachable from where this page is hosted.</p>
      </div>`;
    }
  }
})();

})();
</script>
